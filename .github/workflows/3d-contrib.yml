name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"   # runs every day at 18:00 UTC
  workflow_dispatch:        # allows manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution graph
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          username: rafiulislam7351-hash
          max-commits-per-day: 16

      - name: Push generated SVGs to the profile-3d-contrib branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --heads origin profile-3d-contrib | grep -q profile-3d-contrib; then
            git fetch origin profile-3d-contrib
            git checkout profile-3d-contrib
          else
            git checkout -b profile-3d-contrib
          fi
          git add -A profile-3d-contrib/
          git commit -m "chore: regenerate 3D contribution graph" || echo "No changes to commit"
          git push origin profile-3d-contrib
